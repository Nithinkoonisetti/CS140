
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up Form</title>
    <link rel="stylesheet" href="forms.css">
</head>

<body>

    <header>
        <h1>Sign Up Form</h1>
        <p>Please fill out the form below.</p>
    </header>

    <main>

        <form action="#" method="get">

            <fieldset>
                <legend>Account</legend>

                <div>
                    <label for="email">Email:</label>
                    <input type="email" id="email" name="email" required>
                </div>

                <div>
                    <label for="password">Password:</label>
                    <input type="password" id="password" name="password" required>
                </div>
            </fieldset>

            <fieldset>
                <legend>About You</legend>

                <div>
                    <label for="name">Full Name:</label>
                    <input type="text" id="name" name="name">
                </div>

                <div>
                    <label for="course">Choose Your Course:</label>
                    <select id="course" name="course">
                        <option value="it">Information Technology</option>
                        <option value="business">Business</option>
                        <option value="other">Other</option>
                    </select>
                </div>

                <div>
                    <label for="birthday">Date of Birth:</label>
                    <input type="date" id="birthday" name="birthday">
                </div>

                <div>
                    <label for="phone">Phone Number:</label>
                    <input type="tel" id="phone" name="phone">
                </div>

                <fieldset>
                    <legend>Choose Your Study Level</legend>

                    <div>
                        <input type="radio" id="freshman" name="level" value="freshman">
                        <label for="freshman">Freshman</label>
                    </div>

                    <div>
                        <input type="radio" id="sophomore" name="level" value="sophomore">
                        <label for="sophomore">Sophomore</label>
                    </div>

                    <div>
                        <input type="radio" id="junior" name="level" value="junior">
                        <label for="junior">Junior</label>
                    </div>
                </fieldset>

                <div>
                    <input type="checkbox" id="sports" name="interests" value="sports">
                    <label for="sports">Sports</label>
                </div>

                <div>
                    <input type="checkbox" id="technology" name="interests" value="technology">
                    <label for="technology">Technology</label>
                </div>

                <div>
                    <label for="message">Why are you interested in this course?</label>
                    <textarea id="message" name="message" rows="5"></textarea>
                </div>

                <div>
                    <label for="color">Favorite Color:</label>
                    <input type="color" id="color" name="color">
                </div>

            </fieldset>

            <button type="submit">Submit</button>

        </form>

    </main>

    <footer>
        <p>&copy; 2026 Nithin Koonisetti</p>
    </footer>

</body>
</html>
